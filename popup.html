<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 360px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: #f5f5f5; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; text-align: center; }
    .header h1 { font-size: 16px; }
    .content { padding: 15px; }
    .status { background: white; border-radius: 6px; padding: 10px; margin-bottom: 10px; font-size: 13px; }
    .status-value.success { color: #52c41a; }
    .status-value.error { color: #ff4d4f; }
    .actions { display: grid; gap: 8px; }
    button { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-secondary { background: white; color: #667eea; border: 1px solid #667eea; }
    .result { background: white; border-radius: 6px; padding: 10px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
    .progress { background: white; border-radius: 6px; padding: 10px; margin: 10px 0; font-size: 12px; color: #666; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>备案域名提取器</h1>
  </div>

  <div class="content">
    <div id="notOnPage" class="hidden" style="text-align:center;padding:30px;color:#999;">
      请在备案查询页面使用
    </div>

    <div id="onPage">
      <div class="status">
        状态: <span id="pageStatus" class="status-value">检测中...</span>
      </div>

      <div class="actions">
        <button id="extractBtn" class="btn-primary" disabled>提取当前页域名</button>
        <button id="extractAllBtn" class="btn-primary" disabled style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
          提取所有页域名
        </button>
        
        <div id="progress" class="progress hidden">
          <span id="progressText">提取中...</span>
        </div>
        
        <div id="result" class="result hidden">
          <div style="font-size:12px;color:#999;margin-bottom:8px;">提取结果:</div>
          <div id="resultList"></div>
        </div>
        
        <button id="copyBtn" class="btn-secondary hidden">复制为文本</button>
        <button id="saveBtn" class="btn-secondary hidden">保存为 JSON</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
